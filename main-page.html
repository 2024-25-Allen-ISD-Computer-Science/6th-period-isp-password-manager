
<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <!--Title and prompt for the "Password Manager" chrome extension-->
      <h1>Guardify</h1>
      <p class="welcome-message">
        Welcome to Guardify! Please login below or if you're new, <a href="#signupForm" id="signupLink">create your account</a>.
      </p>
      <!-- Allows for user input for username and password for login-->
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email Address:</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
         <!-- Submit button to login -->
        <button type="submit">Login</button>
         <!-- Forgot password function-->
        <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSepaFjKrgqhB5sFX2OGdubfHBkpvfYGkEaaBU_vJCX6kChFbQ/viewform?usp=sf_link" id="forgotPasswordLink">Forgot Password?</a></p>
      </form>
    </div>
  </body>
</html>
