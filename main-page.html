<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {background-color: powderblue;}
      h1   {color: blue;}
      p    {color: red;}
    </style>
   html {
     height: 800px;  
     width: 600px;      
   }
   </head>
    <!--Title and prompt for the "Password Manager" chrome extension-->
    <h1>Password Manager</h1>
    <hr>
    <p class="welcome-message">
    Welcome to Password Manager! Please login below or if you're new, <a href="#signupForm" id="signupLink">create your account</a>.
    </p>
    <!-- Allows for user input for username and password for login-->
    <hr>
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
          <label for="username">Username or Email Address:</label>
          <input type="text" id="username" required>
      </div>
      <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required>
      </div>
       <!-- Submit button to login -->
    <button type="submit">Login</button>
      <!-- Forgot password function-->
      <p><a href="#forgotPassword" id="forgotPasswordLink">Forgot Password?</a></p>
  </form>
  </body>
</html>
