
<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 400px;
        padding: 20px;
        text-align: center;
      }
      h1 {
        color: #1e88e5;
        font-size: 2rem;
        margin-bottom: 10px;
      }
      p {
        color: #546e7a;
        margin: 10px 0;
      }
      a {
        color: #1e88e5;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      label {
        display: block;
        color: #424242;
        margin-bottom: 5px;
      }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #cfd8dc;
        border-radius: 5px;
        outline: none;
        font-size: 1rem;
      }
      input[type="text"]:focus, input[type="password"]:focus {
        border-color: #1e88e5;
      }
      button {
        background: #1e88e5;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #1565c0;
      }
      .welcome-message {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!--Title and prompt for the "Password Manager" chrome extension-->
      <h1>Guardify</h1>
      <p class="welcome-message">
        Welcome to Guardify! Please login below or if you're new, <a href="#signupForm" id="signupLink">create your account</a>.
      </p>
      <!-- Allows for user input for username and password for login-->
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email Address:</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
         <!-- Submit button to login -->
        <button type="submit">Login</button>
         <!-- Forgot password function-->
        <p><a href="#forgotPassword" id="forgotPasswordLink">Forgot Password?</a></p>
      </form>
    </div>
  </body>
</html>
